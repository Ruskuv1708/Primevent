gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    application/xml
    image/svg+xml;

map $host $crm_workspace_subdomain {
    default crm;
    testcrm.primevent.uz testcrm;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

resolver 127.0.0.11 valid=10s ipv6=off;

upstream gk_techsupp_pool {
    zone gk_techsupp_pool 64k;
    server gk_techsupp_web:5000 max_fails=1 fail_timeout=5s;
    server gk_techsupp_backup:5000 backup max_fails=1 fail_timeout=5s;
    keepalive 16;
}

server {
    listen 80;
    server_name primevent.uz www.primevent.uz crm.primevent.uz testcrm.primevent.uz;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name primevent.uz www.primevent.uz;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/primevent.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primevent.uz/privkey.pem;

    location = /api/.env {
        access_log off;
        return 404;
    }

    location ~* ^/api/(v[0-9]+/|dev/|staging/)?\.env$ {
        access_log off;
        return 404;
    }

    location ^~ /api/vendor/phpunit/ {
        access_log off;
        return 404;
    }

    location ~* ^/api/(config|settings|env|secrets|credentials|vault|keys|account|sonicos)(/|$) {
        access_log off;
        return 404;
    }

    location ~* ^/(api/)?(.*\.env|vendor/phpunit|wp-admin|wp-login\.php|wordpress|phpmyadmin|pma|\.git|\.svn|composer\.(json|lock)|config|settings|env|secrets|credentials|vault|keys|account|v[123]/.env|sonicos) {
        access_log off;
        return 404;
    }

    location /api {
        set $backend_upstream http://backend:8000;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream http://frontend:80;

        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name crm.primevent.uz;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/primevent.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primevent.uz/privkey.pem;

    location = /api/.env {
        access_log off;
        return 404;
    }

    location ~* ^/api/(v[0-9]+/|dev/|staging/)?\.env$ {
        access_log off;
        return 404;
    }

    location ^~ /api/vendor/phpunit/ {
        access_log off;
        return 404;
    }

    location ~* ^/api/(config|settings|env|secrets|credentials|vault|keys|account|sonicos)(/|$) {
        access_log off;
        return 404;
    }

    location ~* ^/(api/)?(.*\.env|vendor/phpunit|wp-admin|wp-login\.php|wordpress|phpmyadmin|pma|\.git|\.svn|composer\.(json|lock)|config|settings|env|secrets|credentials|vault|keys|account|v[123]/.env|sonicos) {
        access_log off;
        return 404;
    }

    location /api {
        set $crm_backend_upstream http://crm_backend:8000;

        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass $crm_backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Workspace-Subdomain $crm_workspace_subdomain;
    }

    location / {
        set $crm_frontend_upstream http://crm_frontend:80;

        proxy_pass $crm_frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name testcrm.primevent.uz;
    server_tokens off;
    client_max_body_size 64m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    resolver 127.0.0.11 valid=30s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/primevent.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/primevent.uz/privkey.pem;

    error_page 502 503 504 =503 /testcrm_fallback.html;

    location = /testcrm_fallback.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "15" always;
    }

    location = /.env {
        access_log off;
        return 404;
    }

    location ~* ^/(.*\.env|credentials|vendor/phpunit|wp-admin|wp-login\.php|wordpress|phpmyadmin|pma|\.git|\.svn|composer\.(json|lock)|config|env|secrets|vault|keys|account|v[123]/.env|sonicos) {
        access_log off;
        return 404;
    }

    location /socket.io/ {
        proxy_pass http://gk_techsupp_pool;
        proxy_http_version 1.1;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 20s;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://gk_techsupp_pool;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 16s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 8s;
        proxy_send_timeout 8s;
    }
}
